<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1B5E20" />
    <meta name="description" content="ASHA Awaaz - Voice-First Healthcare Register for ASHA Workers" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>ASHA Awaaz | आशा आवाज़</title>
    <style>
      /* Lightweight inline fallback styles to prevent any initial white screen */
      body {
        margin: 0;
        padding: 0;
        background-color: #FBFBFA;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .initial-loader-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .initial-logo-card {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background-color: #E8F5E9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
        animation: pulse 1.8s infinite ease-in-out;
      }
      .initial-title {
        font-size: 1.5rem;
        font-weight: 900;
        color: #1B5E20;
        margin-top: 1rem;
        letter-spacing: -0.025em;
      }
      .initial-subtitle {
        font-size: 0.8125rem;
        color: #555;
        font-weight: 600;
        margin-top: 0.25rem;
      }
      .initial-spinner {
        margin-top: 1.5rem;
        width: 24px;
        height: 24px;
        border: 2.5px solid #E0E0E0;
        border-top-color: #2E7D32;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-surface-warm text-surface-dark select-none min-h-screen">
    <div id="root">
      <!-- Branded instant loading placeholder — instantly replaced when React mounts -->
      <div class="initial-loader-container">
        <div class="initial-logo-card">🩺</div>
        <div class="initial-title">ASHA Awaaz</div>
        <div class="initial-subtitle">Your voice. Their health. Better care.</div>
        <div class="initial-spinner"></div>
      </div>
    </div>

    <!-- Self-healing fallback for stale chunk load failures -->
    <script>
      window.addEventListener('error', function (e) {
        // Detect chunk loading errors (e.g. from an outdated PWA cache)
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('loading chunk') !== -1 || msg.indexOf('failed to fetch dynamically imported module') !== -1) {
          if (!sessionStorage.getItem('asha_chunk_reloaded')) {
            sessionStorage.setItem('asha_chunk_reloaded', 'true');
            if ('caches' in window) {
              caches.keys().then(function (names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              }).finally(function () {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').then(function (reg) {
            reg.onupdatefound = function () {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Force update to fresh caches immediately
                    installingWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
